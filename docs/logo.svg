<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="wikicc logo">
  <title>wikicc</title>
  <defs>
    <linearGradient id="wikicc-bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle plate, Windows-11-like corner radius -->
  <rect width="512" height="512" rx="112" fill="url(#wikicc-bg)"/>

  <!-- Link graph: three document nodes, fully connected -->
  <g stroke="#FFFFFF" stroke-width="36" stroke-linecap="round">
    <line x1="150" y1="360" x2="256" y2="150"/>
    <line x1="362" y1="360" x2="256" y2="150"/>
    <line x1="150" y1="360" x2="362" y2="360"/>
  </g>
  <circle cx="256" cy="150" r="52" fill="#FFFFFF"/>
  <circle cx="150" cy="360" r="52" fill="#FFFFFF"/>
  <circle cx="362" cy="360" r="52" fill="#FFFFFF"/>
</svg>
