[package]
name = "wikicc"
version = "2.0.1"
edition = "2024"
description = "Compile a folder of Markdown documents into a self-contained offline HTML reader"
license = "GPL-3.0-only"

[lib]
name = "wikicc"
path = "src/lib.rs"

[[bin]]
name = "wikicc"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.10", features = ["getrandom"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
icu = "2.4.0"
mime_guess = "2"
minijinja = "2"
markdown = "1"
pbkdf2 = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
    "default-syntaxes",
    "default-themes",
    "html",
] }
thiserror = "2"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Windows executables carry their icon in the PE resource section, which the
# build script compiles in. The dependency is plain rather than
# target-specific on purpose: a target-specific build dependency is resolved
# for the *target*, while the code that uses it lives in a build script that is
# compiled for the *host*, so the two can disagree and the build script would
# fail to compile. The library itself is a no-op on non-Windows targets, and
# `build.rs` only calls it for a Windows target.
[build-dependencies]
base64 = "0.23"
embed-resource = "3"

# Highlighting is regex-bound: compiling the engine with optimisations keeps the
# 5000-line performance guard of `markdown::highlight` meaningful in the default
# (unoptimised) dev and test profiles, where it would otherwise take seconds.
[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.syntect]
opt-level = 3

[profile.test.package.fancy-regex]
opt-level = 3

[profile.test.package.regex-automata]
opt-level = 3

[profile.test.package.syntect]
opt-level = 3

# Key derivation is SHA-256-bound: compiling the hash and its PBKDF2 driver
# with optimisations keeps per-document sealing (600k rounds) and its
# round-trip tests fast in the default (unoptimised) dev and test profiles.
[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.pbkdf2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
